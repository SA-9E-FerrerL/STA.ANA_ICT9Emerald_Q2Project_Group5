<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBMC LP</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #fdf6ec;
      color: #3e3a36;
      margin: 0;
      padding-top: 80px;
    }

    .navbar {
      background-color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(5px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .navbar-brand {
      color: #6b4226 !important;
      font-weight: 700;
      font-size: 1.6rem;
    }

    .nav-link {
      color: #3e3a36 !important;
      font-weight: 500;
      padding: 0.75rem 1.2rem;
      font-size: 1rem;
    }

    .nav-link.active {
      font-weight: 600;
      color: #c85c38 !important;
    }

    .navbar-toggler {
      border: none;
    }

    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba%2830,30,30,1%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
    }

    .navbar-collapse {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 1rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .header {
      background: linear-gradient(135deg, #3f7d6c, #f0d5b2);
      padding: 4rem 1rem;
      text-align: center;
      color: white;
      margin-bottom: 2rem;
    }

    .course-card {
      border-radius: 22px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 12px 25px rgba(0,0,0,0.12);
      transition: 0.3s;
      height: 100%;
    }

    .course-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 35px rgba(0,0,0,0.18);
    }

    .course-card img {
      width: 100%;
      border-radius: 16px;
      margin-top: 10px;
    }

    .terracotta { background:#f3c1a1; }
    .sea { background:#cfe8e1; }
    .olive { background:#d8e0c5; }
    .ochre { background:#f4d6a0; }
    .clay { background:#e7c3ad; }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg shadow-sm fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">OBMC</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="page2.html">Courses Offer</a></li>
        <li class="nav-item"><a class="nav-link" href="page3.html">Contact Us</a></li>
        <li class="nav-item"><a class="nav-link" href="page4.html">Enroll Now</a></li>
        <li class="nav-item"><a class="nav-link" href="page5.html">About the Group Members</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="header">
  <h1>Courses Offer</h1>
  <p>Discover the learning journey at OBMC</p>
</div>

<div class="container my-5">
  <div class="row g-4">
    <div class="col-md-4">
      <div class="course-card terracotta">
        <h3>Casa</h3>
        <img src="img1.jpeg" alt="Casa">
      </div>
    </div>
    <div class="col-md-4">
      <div class="course-card sea">
        <h3>Primary</h3>
        <img src="img2.jpeg" alt="Primary">
      </div>
    </div>
    <div class="col-md-4">
      <div class="course-card olive">
        <h3>Intermediate</h3>
        <img src="img3.jpeg" alt="Intermediate">
      </div>
    </div>
    <div class="col-md-6">
      <div class="course-card ochre">
        <h3>Junior High School</h3>
        <img src="img4.jpeg" alt="Junior High School">
      </div>
    </div>
    <div class="col-md-6">
      <div class="course-card clay">
        <h3>Senior High School</h3>
        <img src="img5.jpeg" alt="Senior High School">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
