<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBMC LP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --terra-cotta: #B46850;
      --sand: #D4C5A9;
      --olive: #7C7F4E;
      --ochre: #D99A3C;
      --clay: #C17551;
      --sea: #3D5A5C;
      --cream: #F5EFE6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, var(--cream) 0%, #EDE4D9 100%);
      font-family: 'Georgia', 'Garamond', serif;
      color: var(--sea);
      min-height: 100vh;
      position: relative;
      padding-top: 100px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(90deg, 
        var(--terra-cotta) 0%, 
        var(--ochre) 25%, 
        var(--olive) 50%, 
        var(--clay) 75%, 
        var(--sea) 100%);
      z-index: 1000;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1001;
      background-color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(5px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .navbar .container {
      max-width: 100%;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    .navbar-brand {
      color: #6b4226 !important;
      font-weight: 700;
      font-size: 1.6rem;
    }

    .nav-link {
      color: #3e3a36 !important;
      font-weight: 500;
      padding: 0.75rem 1.2rem;
      font-size: 1rem;
    }

    .nav-link.active {
      font-weight: 600;
      color: #c85c38 !important;
    }

    .navbar-toggler {
      border: none;
    }

    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba%2830,30,30,1%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
    }

    .navbar-collapse {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 1rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .container {
      max-width: 900px;
      margin: 2rem auto;
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid var(--sand);
      border-radius: 2px;
      padding: 3rem;
      box-shadow: 
        0 8px 32px rgba(61, 90, 92, 0.15),
        inset 0 0 0 1px rgba(212, 197, 169, 0.3);
      position: relative;
    }

    .container::before,
    .container::after {
      content: '';
      position: absolute;
      background: var(--ochre);
      opacity: 0.6;
    }

    .container::before {
      top: 15px;
      left: 15px;
      right: 15px;
      height: 2px;
    }

    .container::after {
      bottom: 15px;
      left: 15px;
      right: 15px;
      height: 2px;
    }

    h2 {
      font-family: 'Georgia', serif;
      color: var(--terra-cotta);
      font-weight: 600;
      font-size: 2.2rem;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
      padding-bottom: 1rem;
      text-shadow: 1px 1px 2px rgba(180, 104, 80, 0.1);
    }

    h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, var(--ochre) 50%, transparent 100%);
      border-radius: 2px;
    }

    h2::before {
      content: '❦';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--ochre);
      font-size: 1.2rem;
      background: white;
      padding: 0 10px;
    }

    section {
      background: white;
      padding: 2.5rem;
      margin-bottom: 3rem;
      border: 2px solid var(--sand);
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(124, 127, 78, 0.08);
      position: relative;
    }

    .table-responsive {
      border: 2px solid var(--olive);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(124, 127, 78, 0.1);
    }

    .table thead th {
      background: linear-gradient(180deg, var(--olive) 0%, #6A6D42 100%);
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.9rem;
      text-align: center;
      padding: 1rem;
      border: none;
    }

    .table tbody td {
      padding: 1rem;
      font-size: 1rem;
      color: var(--sea);
      font-weight: 500;
      text-align: center;
    }

    .table tbody tr:nth-child(odd) { background: var(--cream); }
    .table tbody tr:nth-child(even) { background: white; }
    .table tbody tr:hover { background: var(--sand); transform: scale(1.01); }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-label {
      color: var(--terra-cotta);
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.3px;
    }

    .form-control {
      border: 2px solid var(--sand);
      border-radius: 4px;
      padding: 0.75rem 1rem;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      color: var(--sea);
      background: white;
      width: 100%;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: var(--olive);
      outline: none;
      background: var(--cream);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--terra-cotta) 0%, var(--clay) 100%);
      border: 2px solid var(--terra-cotta);
      color: white;
      font-family: 'Georgia', serif;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 0.75rem 2.5rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      align-self: flex-start;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--clay) 0%, var(--terra-cotta) 100%);
      border-color: var(--clay);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      body { padding: 110px 10px 20px; }
      .container { padding: 2rem 1.5rem; }
      h2 { font-size: 1.8rem; }
      .btn-primary { width: 100%; align-self: stretch; }
    }

  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg shadow-sm fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">OBMC</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="page2.html">Courses Offer</a></li>
        <li class="nav-item"><a class="nav-link active" href="page3.html">Contact Us</a></li>
        <li class="nav-item"><a class="nav-link" href="page4.html">Enroll Now</a></li>
        <li class="nav-item"><a class="nav-link" href="page5.html">About Members</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">

  <section class="mb-5">
    <h2>School Office Hours</h2>
    <div class="table-responsive">
      <table class="table table-bordered align-middle text-center">
        <thead class="table-light">
          <tr>
            <th>Day</th>
            <th>Office Hours</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Monday</td><td>8:00 AM – 4:00 PM</td></tr>
          <tr><td>Tuesday</td><td>8:00 AM – 4:00 PM</td></tr>
          <tr><td>Wednesday</td><td>8:00 AM – 4:00 PM</td></tr>
          <tr><td>Thursday</td><td>8:00 AM – 4:00 PM</td></tr>
          <tr><td>Friday</td><td>8:00 AM – 3:00 PM</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>Contact Us</h2>
    <form class="contact-form">
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <input class="form-control" type="text" id="fullName" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-control" type="email" id="email" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="message">Message</label>
        <textarea class="form-control" id="message" rows="5" placeholder="Type your message here..." required></textarea>
      </div>
      <button type="submit" class="btn-primary">Submit</button>
    </form>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
